<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apple News 日本語まとめ</title>
<meta name="description" content="海外・国内のApple関連ニュースを自動で収集し、日本語の見出しと要約でまとめています。6時間ごとに更新。">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Appleニュース">
<meta property="og:title" content="Apple News 日本語まとめ">
<meta property="og:description" content="海外・国内のApple関連ニュースを日本語の見出しと要約で。6時間ごとに自動更新。">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: rgba(0,0,0,.08);
    --accent: #0071e3;
    --chip: rgba(0,0,0,.05);
    --chip-on: #1d1d1f;
    --chip-on-text: #ffffff;
    --badge: #d70015;
    --header: rgba(245,245,247,.82);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --line: rgba(255,255,255,.1);
      --accent: #2997ff;
      --chip: rgba(255,255,255,.1);
      --chip-on: #f5f5f7;
      --chip-on-text: #000000;
      --badge: #ff453a;
      --header: rgba(0,0,0,.75);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--header);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
    padding: max(env(safe-area-inset-top), 10px) 16px 0;
  }
  .bar { max-width: 760px; margin: 0 auto; display: flex; align-items: baseline; gap: 10px; }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .updated { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .filters {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 0;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 0; cursor: pointer;
    background: var(--chip); color: var(--text);
    font: inherit; font-size: 13px; line-height: 1.4;
    padding: 6px 13px; border-radius: 999px;
    font-family: inherit;
  }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); }

  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 56px; }
  .search {
    width: 100%; margin-bottom: 14px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; font: inherit; font-size: 16px;
  }
  .search::placeholder { color: var(--muted); }

  article {
    background: var(--card); border-radius: 16px;
    padding: 15px 17px; margin-bottom: 11px;
    border: 1px solid var(--line);
    transition: transform .15s ease;
  }
  article:active { transform: scale(.99); }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .row .body { flex: 1 1 auto; min-width: 0; }
  .thumb {
    flex: 0 0 96px; width: 96px; height: 96px;
    object-fit: cover; border-radius: 10px;
    background: var(--chip); display: block;
  }
  .hero {
    /* 幅の広い画面で主役の画像が伸びすぎないように上限を付ける。 */
    width: 100%; aspect-ratio: 16 / 9; max-height: 300px; object-fit: cover;
    border-radius: 12px; background: var(--chip);
    display: block; margin-bottom: 11px;
  }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin-bottom: 7px; }
  .tag { background: var(--chip); border-radius: 6px; padding: 2px 7px; color: var(--text); }
  .badge { background: var(--badge); color: #fff; border-radius: 6px; padding: 2px 7px; font-weight: 600; }
  .flag { font-size: 12px; }
  h2 { font-size: 17px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; line-height: 1.45; }
  p.summary { margin: 0 0 10px; font-size: 14px; color: var(--text); opacity: .85; }
  .src { font-size: 12.5px; color: var(--accent); font-weight: 500; }

  .empty, .loading { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; }
  #more {
    display: block; width: 100%; margin-top: 8px; padding: 13px;
    background: var(--card); color: var(--accent); border: 1px solid var(--line);
    border-radius: 12px; font: inherit; font-size: 15px; cursor: pointer;
  }
  footer {
    max-width: 760px; margin: 0 auto; padding: 24px 16px 40px;
    font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line);
  }
  footer p { margin: 0 0 7px; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>Apple News 日本語まとめ</h1>
    <span class="updated" id="updated"></span>
  </div>
  <div class="filters" id="regionFilters"></div>
  <div class="filters" id="categoryFilters"></div>
</header>

<main>
  <input class="search" id="search" type="search" placeholder="キーワードで絞り込む（例: iPhone 18、Vision Pro）" autocomplete="off">
  <div id="list"><p class="loading">読み込み中…</p></div>
  <button id="more" hidden>もっと見る</button>
</main>

<footer>
  <p>海外・国内のApple関連メディアのRSSを自動収集し、日本語の見出し・要約・解説を機械生成しています。いずれも原文の翻訳ではありません。正確な内容は必ず出典元の記事をご確認ください。原文そのものを日本語で読みたいときは、各記事の「原文を日本語で全文読む」からGoogle翻訳が開きます。</p>
  <p>サムネイルは各媒体が配信データ（RSS・OGP）で公開している画像を、出典と原文リンクを添えて表示しています。</p>
  <p>記事および画像の著作権は各媒体に帰属します。掲載の停止をご希望の媒体様はリポジトリのIssueよりご連絡ください。</p>
  <p id="sources"></p>
</footer>

<script>
const PAGE_SIZE = 30;
let all = [], filtered = [], shown = 0;
let region = "all", category = "all", query = "";

const fmt = new Intl.DateTimeFormat("ja-JP", {
  month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo"
});

function relative(iso) {
  const then = new Date(iso), diff = (Date.now() - then) / 1000;
  if (diff < 3600) return `${Math.max(1, Math.floor(diff / 60))}分前`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}時間前`;
  if (diff < 604800) return `${Math.floor(diff / 86400)}日前`;
  return fmt.format(then);
}

// Google翻訳を通した原文ページ。1タップで日本語の全文が読める。
function translated(url) {
  return "https://translate.google.com/translate?sl=auto&tl=ja&u=" + encodeURIComponent(url);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function apply() {
  const q = query.trim().toLowerCase();
  filtered = all.filter(item => {
    if (region === "official" && !item.official) return false;
    if (region !== "all" && region !== "official" && item.region !== region) return false;
    if (category !== "all" && item.category !== category) return false;
    if (q) {
      const hay = `${item.title_ja} ${item.summary_ja} ${item.title_original} ${item.source}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  shown = 0;
  document.getElementById("list").innerHTML = "";
  render();
}

function render() {
  const list = document.getElementById("list");
  const slice = filtered.slice(shown, shown + PAGE_SIZE);
  if (!filtered.length) {
    list.innerHTML = '<p class="empty">該当する記事がありません</p>';
    document.getElementById("more").hidden = true;
    return;
  }
  list.insertAdjacentHTML("beforeend", slice.map((item, i) => {
    // 先頭と「重要」な記事だけ大きい画像にして、一覧に緩急をつける。
    const hero = item.image && (shown + i === 0 || item.importance >= 4);
    const meta = `
        <div class="meta">
          ${item.importance >= 4 ? '<span class="badge">重要</span>' : ""}
          <span class="tag">${escapeHtml(item.category)}</span>
          <span class="flag">${item.region === "jp" ? "🇯🇵" : "🌍"}</span>
          <span>${escapeHtml(item.source)}</span>
          <span>・${relative(item.published)}</span>
        </div>`;
    const title = `<h2>${escapeHtml(item.title_ja)}</h2>`;
    const img = cls => item.image
      ? `<img class="${cls}" src="${escapeHtml(item.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`
      : "";
    const head = hero
      ? `${img("hero")}${meta}${title}`
      : (item.image
          // 出典と時刻は幅いっぱいに置き、見出しだけサムネイルと並べる。
          ? `${meta}<div class="row"><div class="body">${title}</div>${img("thumb")}</div>`
          : `${meta}${title}`);
    // 解説があれば詳細ページへ。無い記事は翻訳済みの原文へ直接飛ばす。
    const target = item.has_detail
      ? { href: `a.html?id=${encodeURIComponent(item.id)}`, blank: false, label: "詳しく読む →" }
      : (item.lang === "ja"
          ? { href: item.url, blank: true, label: "原文を読む →" }
          : { href: translated(item.url), blank: true, label: "日本語で原文を読む →" });
    return `
    <article>
      <a href="${escapeHtml(target.href)}"${target.blank ? ' target="_blank" rel="noopener noreferrer"' : ""}>
        ${head}
        <p class="summary">${escapeHtml(item.summary_ja)}</p>
        <span class="src">${target.label}</span>
      </a>
    </article>`;
  }).join(""));
  shown += slice.length;
  document.getElementById("more").hidden = shown >= filtered.length;
}

// 該当0件のチップは押しても空になるだけなので、そもそも出さない。
function buildRegionChips() {
  const defs = [
    { key: "all", label: "すべて", match: () => true },
    { key: "global", label: "🌍 海外", match: i => i.region === "global" },
    { key: "jp", label: "🇯🇵 国内", match: i => i.region === "jp" },
    { key: "official", label: "Apple公式", match: i => i.official },
  ];
  document.getElementById("regionFilters").innerHTML = defs
    .filter(d => d.key === "all" || all.some(d.match))
    .map(d => `<button class="chip" data-region="${d.key}" aria-pressed="${d.key === region}">${d.label}</button>`)
    .join("");
}

function buildCategoryChips(categories) {
  const box = document.getElementById("categoryFilters");
  const used = new Set(all.map(i => i.category));
  if (category !== "all" && !used.has(category)) category = "all";
  box.innerHTML = [`<button class="chip" data-category="all" aria-pressed="${category === "all"}">全カテゴリ</button>`]
    .concat(categories.filter(c => used.has(c)).map(c =>
      `<button class="chip" data-category="${escapeHtml(c)}" aria-pressed="${category === c}">${escapeHtml(c)}</button>`))
    .join("");
}

// チップは読み込みのたびに作り直すので、クリックは親側で1度だけ受ける。
function chipHandler(attr, setValue) {
  return e => {
    const btn = e.target.closest(`[data-${attr}]`);
    if (!btn) return;
    setValue(btn.dataset[attr]);
    e.currentTarget.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === btn)));
    apply();
  };
}

document.getElementById("regionFilters").addEventListener("click", chipHandler("region", v => { region = v; }));
document.getElementById("categoryFilters").addEventListener("click", chipHandler("category", v => { category = v; }));

document.getElementById("more").addEventListener("click", render);

let timer;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(timer);
  query = e.target.value;
  timer = setTimeout(apply, 180);
});

async function load() {
  try {
    const res = await fetch(`articles.json?t=${Date.now()}`, { cache: "no-store" });
    const data = await res.json();
    all = data.items || [];
    document.getElementById("updated").textContent = data.updated_at ? `更新 ${relative(data.updated_at)}` : "";
    document.getElementById("sources").textContent = "収集元: " + (data.sources || []).join("、");
    buildRegionChips();
    buildCategoryChips(data.categories || []);
    apply();
  } catch (err) {
    document.getElementById("list").innerHTML = '<p class="empty">記事を読み込めませんでした。時間をおいて再読み込みしてください。</p>';
  }
}

load();
// ホーム画面から復帰したときに最新へ追従する。
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") load();
});
</script>
</body>
</html>
