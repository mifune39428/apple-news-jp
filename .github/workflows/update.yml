name: ニュース自動更新

on:
  schedule:
    # 6時間ごと（UTC 0/6/12/18 = 日本時間 9時/15時/21時/3時）
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# 前の実行が終わる前に次が始まると push が衝突するので、直列にする。
concurrency:
  group: news-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # rebase するので履歴を全部取る（浅いクローンだと共通の祖先が無くて失敗する）
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 記事を収集して日本語化
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 collect.py

      - name: 差分があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "新着なし。コミットしません。"
          else
            git commit -m "ニュース自動更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            # 実行中に手元から push が入ると弾かれる。取り込み直して押し直す。
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push が弾かれました。取り込み直して $i 回目の再挑戦…"
              git pull --rebase origin main || exit 1
              sleep 5
            done
            [ "$pushed" = 1 ] || { echo "3回試しても push できませんでした"; exit 1; }
          fi
